<style>
@font-face{font-family:"Source Serif 4";font-weight:600;src:url(fuentes/source-serif-4-latin-600-normal.woff2)}
@font-face{font-family:"Source Serif 4";font-weight:700;src:url(fuentes/source-serif-4-latin-700-normal.woff2)}
@font-face{font-family:"Source Sans 3";font-weight:400;src:url(fuentes/source-sans-3-latin-400-normal.woff2)}
@font-face{font-family:"Source Sans 3";font-weight:600;src:url(fuentes/source-sans-3-latin-600-normal.woff2)}
body{margin:0;font:15px system-ui;background:#e9eef0;color:#222}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ccd;padding:.7rem 1.2rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
select{font:inherit;padding:.3rem .5rem;border-radius:6px;border:1px solid #99a;background:#fff}
#aviso{font-size:.85rem;color:#556}.bad{color:#a11;font-weight:700}.good{color:#176b3a}
h2.g{margin:1.2rem 1.2rem .2rem;font:700 1.05rem system-ui}
main{padding:.6rem 1.2rem 2rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:1.2rem}
.marco h3{font:600 .82rem system-ui;margin:0 0 .3rem;color:#445}
.caja{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid #bbc;box-shadow:0 4px 16px #0002}
.lam{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:top left;box-sizing:border-box;padding:56px 60px;
  background:var(--fondo);color:var(--texto);font:400 29px/1.38 "Source Sans 3",sans-serif}
.lam h2{font:700 56px/1.1 "Source Serif 4",serif;color:var(--principal);margin:0 0 .5em;max-width:22ch;letter-spacing:-.01em}
.grid{display:grid;gap:26px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.t{font:700 34px/1.15 "Source Serif 4",serif}.p{font-size:25px;line-height:1.35;margin-top:.35em}.cita{font-size:19px;color:var(--suave);margin-top:.5em}
.ic{width:1.6em;height:1.6em}
/* A · sin caja, línea y número */
.A{border-top:3px solid var(--borde);padding-top:14px}.A .n{font:700 78px/1 "Source Serif 4",serif;color:var(--principal);opacity:.9}.A .t{color:var(--texto);margin-top:.1em}.A .p{color:var(--texto)}
/* B · tarjeta limpia con sombra suave */
.B{background:color-mix(in srgb,var(--fondo) 55%,#fff);border:1px solid var(--borde);border-radius:18px;padding:24px 26px;box-shadow:0 8px 22px color-mix(in srgb,var(--texto) 12%,transparent)}
.B .circ{width:64px;height:64px;border-radius:50%;background:var(--principal);color:var(--sobre-p);display:grid;place-items:center;margin-bottom:14px}
.B .circ svg{width:34px;height:34px}.B .t{color:var(--texto)}
/* C · franja lateral */
.C{border-left:9px solid var(--acento);padding:6px 0 6px 24px;background:linear-gradient(90deg,color-mix(in srgb,var(--tarjeta) 55%,transparent),transparent 85%)}.C .t{color:var(--texto)}.C .k{font:600 21px "Source Sans 3";text-transform:uppercase;letter-spacing:.09em;color:var(--acento);margin-bottom:.15em}
/* D · bloque lleno */
.D{background:var(--principal);color:var(--sobre-p);border-radius:16px;padding:24px 26px}.D .t{color:var(--sobre-p)}.D .p{color:var(--sobre-p)}.D .circ{width:60px;height:60px;border-radius:12px;background:color-mix(in srgb,var(--sobre-p) 20%,transparent);display:grid;place-items:center;margin-bottom:12px}.D svg{width:34px;height:34px}.D .cita{color:var(--sobre-p);opacity:.9}
/* perfil visual: más aire, menos texto, icono grande */
.vis .grid{margin-top:70px;gap:34px}.vis .t{font-size:42px}.vis .p{font-size:28px}.vis.lam h2{font-size:64px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>

const ICO=(n)=>`<svg><use href="#i${n}"/></svg>`;
const DATOS=[["Entradas","Los datos y supuestos con los que arranca el modelo: clima, geometría y materiales.","(sec. 2)","Entradas","Datos y supuestos"],
 ["Modelo","Un conjunto de ecuaciones que resume cómo se comporta el sistema que se estudia.","(sec. 3)","Modelo","Ecuaciones del sistema"],
 ["Resultados","Series de tiempo y cifras que se comparan contra un caso base de referencia.","(sec. 4)","Resultados","Series y cifras"],
 ["Verificación","Se revisa que el resultado tenga sentido antes de usarlo para decidir.","(sec. 5)","Verificación","¿Tiene sentido?"]];
const ICONOS=[1,2,3,4];
function tarj(est,i,vis,total){
  const [t,p,c,tv,pv]=DATOS[i], tx=vis?pv:p, ti=vis?tv:t;
  if(est==="A")return `<div class="A"><div class="n">0${i+1}</div><div class="t">${ti}</div><div class="p">${tx}</div>${vis?"":`<div class="cita">${c}</div>`}</div>`;
  if(est==="B")return `<div class="B"><div class="circ">${ICO(ICONOS[i])}</div><div class="t">${ti}</div><div class="p">${tx}</div>${vis?"":`<div class="cita">${c}</div>`}</div>`;
  if(est==="C")return `<div class="C"><div class="k">Paso ${i+1}</div><div class="t">${ti}</div><div class="p">${tx}</div>${vis?"":`<div class="cita">${c}</div>`}</div>`;
  return `<div class="D"><div class="circ">${ICO(ICONOS[i])}</div><div class="t">${ti}</div><div class="p">${tx}</div>${vis?"":`<div class="cita">${c}</div>`}</div>`;
}
const NOM={A:"A · Sin caja, con línea y número",B:"B · Tarjeta limpia con sombra suave",C:"C · Franja lateral de color",D:"D · Bloque de color lleno"};
function armar(){
  for(const [id,vis] of [["apunte",false],["visual",true]]){
    $(id).innerHTML=["A","B","C","D"].map(e=>{const n=vis?4:3;
      return `<div class="marco"><h3>${NOM[e]}</h3><div class="caja"><div class="lam ${vis?"vis":""}"><h2>${vis?"Cómo funciona una simulación":"Una simulación en cuatro pasos que se pueden revisar"}</h2>
      <div class="grid ${vis?"g4":"g3"}">${Array.from({length:n},(_,i)=>tarj(e,i,vis)).join("")}</div></div></div></div>`;}).join("");
  }
}
function lum(h){const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=0.04045?v/12.92:((v+0.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function razon(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
PALETAS.forEach((p,i)=>$("tema").add(new Option(`${p.nombre} (tono ${p.tono}°)`,i)));
$("tema").value=PALETAS.findIndex(p=>p.nombre==="turquesa-192");
function aplicar(){
  const c=PALETAS[$("tema").value][$("modo").value].colores;
  const rf=razon(c.fondo,c.principal), rt=razon(c.texto,c.principal), sobre=rf>=rt?c.fondo:c.texto, r=Math.max(rf,rt);
  document.querySelectorAll(".lam").forEach(l=>{for(const k in c)l.style.setProperty("--"+k,c[k]);l.style.setProperty("--sobre-p",sobre);});
  $("aviso").innerHTML=`Texto sobre el color principal (bloque lleno D, círculos de B): ${r.toFixed(2)}:1 `+(r>=4.5?'<span class="good">✓ cumple 4.5:1</span>':'<span class="bad">⚠ no llega a 4.5:1: ese texto es pequeño</span>');
  document.body.style.background=$("modo").value==="oscuro"?"#2a2e33":"#e9eef0";
}
function escalar(){document.querySelectorAll(".lam").forEach(l=>{l.style.transform=`scale(${l.parentElement.clientWidth/1280})`;});}
armar(); $("tema").onchange=$("modo").onchange=aplicar; addEventListener("resize",escalar);
document.fonts.ready.then(()=>{aplicar();escalar();});
</script></html>
